# Change these values before applying (or create the secret yourself with kubectl):
#   kubectl -n n8n-slack-demo create secret generic n8n-secrets \
#     --from-literal=N8N_BASIC_AUTH_USER=admin \
#     --from-literal=N8N_BASIC_AUTH_PASSWORD='change-me' \
#     --from-literal=N8N_ENCRYPTION_KEY="$(openssl rand -hex 32)"
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n-slack-demo
type: Opaque
stringData:
  N8N_BASIC_AUTH_USER: "admin"
  N8N_BASIC_AUTH_PASSWORD: "change-me"
  N8N_ENCRYPTION_KEY: "change-me-to-a-random-32-byte-hex-string"
---
# Shared secret the n8n workflow must send in the `x-inbox-secret` header when
# forwarding Slack messages to talkbackapp's /api/inbox endpoint. Keep in sync with
# the value you put in the "Forward to TalkbackApp" HTTP Request node.
apiVersion: v1
kind: Secret
metadata:
  name: talkbackapp-secrets
  namespace: n8n-slack-demo
type: Opaque
stringData:
  INBOUND_SHARED_SECRET: "change-me-shared-secret"
