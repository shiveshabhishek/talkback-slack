<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>n8n ⇄ Slack Bridge</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f1115;
    color: #e8eaed;
    display: flex;
    flex-direction: column;
    height: 100vh;
  }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid #262a33;
    background: #14161c;
  }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 13px; color: #9aa0a8; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .msg {
    max-width: 70%;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .msg .meta { font-size: 11px; opacity: 0.65; margin-bottom: 2px; }
  .outbound { align-self: flex-end; background: #2a6df4; color: white; }
  .inbound { align-self: flex-start; background: #262a33; color: #e8eaed; }
  .error { color: #ff6b6b; font-size: 11px; margin-top: 2px; }
  form {
    display: flex;
    gap: 8px;
    padding: 14px 20px;
    border-top: 1px solid #262a33;
    background: #14161c;
  }
  input[type=text] {
    flex: 1;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid #333844;
    background: #1b1e25;
    color: #e8eaed;
    font-size: 14px;
  }
  button {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    background: #2a6df4;
    color: white;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  #empty { color: #6b7280; font-size: 13px; text-align: center; margin-top: 40px; }
</style>
</head>
<body>
  <header>
    <h1>n8n ⇄ Slack Bridge</h1>
    <p>Blue bubbles = sent from this UI to Slack. Gray bubbles = replies received from Slack.</p>
  </header>
  <div id="log"><div id="empty">No messages yet. Send one below.</div></div>
  <form id="send-form">
    <input id="text" type="text" placeholder="Type a message to send to Slack…" autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script>
    const logEl = document.getElementById('log');
    const emptyEl = document.getElementById('empty');
    const form = document.getElementById('send-form');
    const input = document.getElementById('text');
    let renderedIds = new Set();

    function fmtTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function render(messages) {
      if (messages.length) emptyEl.style.display = 'none';
      for (const m of messages) {
        if (renderedIds.has(m.id)) continue;
        renderedIds.add(m.id);
        const div = document.createElement('div');
        div.className = 'msg ' + (m.direction === 'outbound' ? 'outbound' : 'inbound');
        const label = m.direction === 'outbound' ? 'You → Slack' : (m.author || 'Slack');
        div.innerHTML = `<div class="meta">${label} · ${fmtTime(m.ts)}</div>${escapeHtml(m.text)}` +
          (m.deliveryError ? `<div class="error">delivery issue: ${escapeHtml(m.deliveryError)}</div>` : '');
        logEl.appendChild(div);
      }
      logEl.scrollTop = logEl.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    async function poll() {
      try {
        const r = await fetch('/api/messages');
        const data = await r.json();
        render(data.messages || []);
      } catch (e) { /* ignore transient errors */ }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: text }),
      });
      poll();
    });

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
